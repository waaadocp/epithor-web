<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epithor — Panel de Usuario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { obsidian: '#0b0c10', surface: '#12141c', accent: '#00f2fe' },
                    fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Space Grotesk', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0c10; color: #e5e7eb; scroll-behavior: smooth; }
        h1, h2, h3, .font-heading { font-family: 'Space Grotesk', sans-serif; }
        .glass-card { background: rgba(26, 29, 40, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- MENÚ CON AVATAR Y CORREO -->
    <header class="fixed top-0 w-full z-50 glass-card border-b border-white/10">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="panel.html" class="flex items-center gap-3">
                <div class="w-10 h-14 rounded-xl overflow-hidden border border-accent/30 bg-surface flex items-center justify-center">
                    <img src="LOGO EPITHOR.JPG" alt="Logo Epithor" class="w-full h-full object-cover">
                </div>
                <span class="text-2xl font-bold font-heading text-white">EPITHOR</span>
            </a>
            
            <nav class="hidden md:flex items-center gap-8 text-sm font-medium">
                <a href="panel.html" class="text-accent font-semibold">Inicio</a>
                <a href="nosotros.html" class="hover:text-accent transition-colors">Sobre nosotros</a>
                <a href="servicios.html" class="hover:text-accent transition-colors">Servicios</a>
                <a href="contacto.html" class="hover:text-accent transition-colors">Contáctanos</a>
            </nav>

            <!-- AVATAR Y CORREO DEL USUARIO -->
            <div class="flex items-center gap-3 bg-surface border border-accent/30 px-4 py-2 rounded-full shadow-lg">
                <div class="w-8 h-8 rounded-full bg-accent/20 border border-accent flex items-center justify-center text-accent">
                    <i class="fa-solid fa-user text-xs"></i>
                </div>
                <span id="userEmailDisplay" class="text-xs font-semibold text-white">correo@epithor.com</span>
                <button onclick="cerrarSesion()" title="Cerrar Sesión" class="text-gray-400 hover:text-red-400 ml-2 cursor-pointer">
                    <i class="fa-solid fa-right-from-bracket text-xs"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="pt-32 pb-20 w-full text-center space-y-12">
        <section class="max-w-4xl mx-auto px-6 pt-12">
            <h1 class="text-4xl md:text-6xl font-bold font-heading text-white">Bienvenido a tu panel de usuario</h1>
            <p class="text-gray-400 text-lg mt-4">Has ingresado correctamente a la plataforma de Epithor.</p>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="bg-[#0e1017] border-t border-white/10 text-gray-400 py-6 text-center text-xs">
        <p>Epithor — Agencia de Identidad Visual</p>
    </footer>

    <!-- SCRIPT PARA DETECTAR EL CORREO INGRESADO -->
    <script>
        window.onload = function() {
            const correoGuardado = localStorage.getItem('epithorUser');
            if (correoGuardado) {
                document.getElementById('userEmailDisplay').innerText = correoGuardado;
            } else {
                window.location.href = "usuarios.html";
            }
        }
        function cerrarSesion() {
            localStorage.removeItem('epithorUser');
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
