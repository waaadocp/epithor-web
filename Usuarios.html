<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epithor — Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { obsidian: '#0b0c10', surface: '#12141c', accent: '#00f2fe' },
                    fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Space Grotesk', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0c10; color: #e5e7eb; }
        h1, h2, h3, .font-heading { font-family: 'Space Grotesk', sans-serif; }
        .glass-card { background: rgba(26, 29, 40, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 relative overflow-hidden">

    <div class="glass-card w-full max-w-md p-8 md:p-10 rounded-3xl shadow-2xl border border-accent/20 relative z-10 space-y-6">
        
        <!-- Logo de la agencia -->
        <div class="text-center space-y-3">
            <div class="w-12 h-16 rounded-xl overflow-hidden border border-accent/30 bg-surface flex items-center justify-center mx-auto">
                <img src="LOGO EPITHOR.JPG" alt="Logo Epithor" class="w-full h-full object-cover">
            </div>
            <h1 class="text-2xl font-bold font-heading text-white">Iniciar Sesión</h1>
            <p class="text-gray-400 text-xs">Ingrese su correo electrónico y contraseña</p>
        </div>

        <!-- Formulario -->
        <form onsubmit="validarLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1">Correo Electrónico</label>
                <input type="email" id="correo" placeholder="ejemplo@correo.com" required 
                    class="w-full bg-[#1a1d28] border border-white/10 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-accent">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required 
                    class="w-full bg-[#1a1d28] border border-white/10 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-accent">
            </div>

            <!-- Validación matemática aleatoria -->
            <div class="bg-[#1a1d28]/60 p-4 rounded-xl border border-white/10 space-y-2">
                <label class="block text-xs font-semibold text-gray-300">Verificación de seguridad</label>
                <div class="flex items-center justify-between text-sm">
                    <span id="mathQuestion" class="text-accent font-heading font-bold text-base"></span>
                    <input type="number" id="mathAnswer" placeholder="Respuesta" required 
                        class="w-28 bg-[#12141c] border border-white/10 rounded-lg px-3 py-2 text-white text-sm text-center focus:outline-none focus:border-accent">
                </div>
            </div>

            <!-- ¿Olvidaste tu contraseña? (Lleva a contacto.html) -->
            <div class="text-right">
                <a href="contacto.html" class="text-xs text-accent hover:underline">¿Olvidaste tu contraseña?</a>
            </div>

            <!-- Botón ingresar -->
            <button type="submit" class="w-full bg-accent text-obsidian font-bold py-3.5 rounded-xl hover:bg-cyan-300 transition-all shadow-lg shadow-accent/20 cursor-pointer">
                Ingresar
            </button>
        </form>

        <!-- Botón regresar -->
        <div class="pt-2 border-t border-white/15 text-center">
            <a href="index.html" class="inline-flex items-center gap-2 text-gray-400 text-xs hover:text-white transition-colors">
                <i class="fa-solid fa-arrow-left"></i> Regresar al Inicio
            </a>
        </div>
    </div>

    <!-- VENTANA MODAL DE ERROR (Si falla la validación) -->
    <div id="errorModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden px-4">
        <div class="bg-[#12141c] border border-red-500/40 w-full max-w-sm p-6 rounded-3xl shadow-2xl text-center space-y-5">
            <div class="w-12 h-12 rounded-full bg-red-500/20 text-red-400 flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <div class="space-y-2">
                <h3 class="text-lg font-bold font-heading text-white">Datos Incorrectos</h3>
                <p id="errorMessage" class="text-gray-400 text-xs">El correo, la contraseña o la verificación no coinciden.</p>
            </div>
            <div class="flex flex-col gap-2.5 pt-2">
                <!-- Botón Intentar Nuevamente -->
                <button onclick="location.reload()" class="w-full bg-accent text-obsidian font-bold py-2.5 rounded-xl text-xs hover:bg-cyan-300 transition-all cursor-pointer">
                    INTENTAR NUEVAMENTE
                </button>
                <div class="grid grid-cols-2 gap-2">
                    <!-- Botón Cancelar -->
                    <a href="index.html" class="w-full bg-transparent border border-white/20 text-white font-semibold py-2.5 rounded-xl text-xs hover:bg-white/5 transition-all text-center">
                        CANCELAR
                    </a>
                    <!-- Botón Ayuda -->
                    <a href="contacto.html" class="w-full bg-blue-600/20 border border-blue-500/40 text-blue-400 font-semibold py-2.5 rounded-xl text-xs hover:bg-blue-600/30 transition-all text-center">
                        AYUDA
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Usuarios fijos dentro del código
        const usuariosValidos = [
            { correo: "valery@epithor.com", password: "123" },
            { correo: "admin@epithor.com", password: "admin" }
        ];

        let num1 = Math.floor(Math.random() * 10) + 1;
        let num2 = Math.floor(Math.random() * 10) + 1;
        document.getElementById('mathQuestion').innerText = `¿Cuánto es ${num1} + ${num2}?`;

        function validarLogin(event) {
            event.preventDefault();
            const correoInput = document.getElementById('correo').value.trim();
            const passInput = document.getElementById('password').value.trim();
            const respuestaUsuario = parseInt(document.getElementById('mathAnswer').value);

            // Validar suma matemática
            if (respuestaUsuario !== (num1 + num2)) {
                document.getElementById('errorMessage').innerText = "La verificación matemática es incorrecta.";
                document.getElementById('errorModal').classList.remove('hidden');
                return;
            }

            // Validar usuario y contraseña
            const usuarioEncontrado = usuariosValidos.find(u => u.correo === correoInput && u.password === passInput);

            if (usuarioEncontrado) {
                localStorage.setItem('epithorUser', usuarioEncontrado.correo);
                window.location.href = "panel.html";
            } else {
                document.getElementById('errorMessage').innerText = "Correo o contraseña incorrectos.";
                document.getElementById('errorModal').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
